[package]
name = "renet_netcode"
version = "1.0.0"
edition = "2021"
keywords = ["gamedev", "networking", "transport"]
description = "netcode transport for the renet crate: Server/Client network library for multiplayer games"
repository = "https://github.com/lucaspoffo/renet"
license = "MIT OR Apache-2.0"

[features]
bevy = ["dep:bevy_ecs"]
static_alloc = ["once_mut"]

[dependencies]
renet = { version = "1.0.0", path = "../renet" }
renetcode = { path = "../renetcode", version = "1.0.0" }
bevy_ecs = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false, optional = true }
octets = "0.3"
once_mut = { version = "0.1.1", optional = true }
log = "0.4.22"
